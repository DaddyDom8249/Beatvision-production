<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeatVision</title>
<style>body{margin:0;background:#090b10;color:#fff;font-family:system-ui}main{max-width:850px;margin:auto;padding:40px 20px}section{background:#121722;border:1px solid #2a3342;border-radius:18px;padding:22px;margin:18px 0}input,textarea,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #394454;background:#0a0d13;color:#fff}button{background:#fff;color:#000;font-weight:800}textarea{min-height:100px}img{max-width:100%;border-radius:12px;margin-top:12px}.hide{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}pre{white-space:pre-wrap}.error{color:#ff9b9b}</style></head>
<body><main><h1>BeatVision</h1><p>Every Song Has a World. BeatVision Reveals It.</p>
<section id="auth"><div class="row"><input id="user" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"></div><div class="row"><button id="register">Create account</button><button id="login">Sign in</button></div><p id="authmsg"></p></section>
<section id="app" class="hide"><button id="logout">Sign out</button><input id="title" placeholder="Song title"><input id="artist" placeholder="Artist"><textarea id="lyrics" placeholder="Lyrics"></textarea><textarea id="dir" placeholder="Creative direction"></textarea><textarea id="notes" placeholder="Notes"></textarea><input id="audio" type="file" accept="audio/*"><button id="create">Create project</button><button id="world" disabled>Reveal World</button><button id="image" disabled>Generate Hero Image</button><button id="render" disabled>Render Video</button><p id="status"></p><div id="report"></div><div id="media"></div></section></main>
<script>
let pid=null,ready=false;
const $=x=>document.getElementById(x);
const text=(el,value)=>{el.textContent=value??""};
async function api(path,options={}){const r=await fetch(path,{credentials:"same-origin",...options});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||"Request failed");return d}
function setStatus(message,error=false){text($("status"),message);$("status").className=error?"error":""}
async function authenticate(mode){try{const d=await api("/api/auth/"+mode,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("auth").classList.add("hide");$("app").classList.remove("hide");text($("authmsg"),"");setStatus("Signed in as "+d.user.username)}catch(e){text($("authmsg"),e.message)}}
async function logout(){try{await api("/api/auth/logout",{method:"POST"})}finally{location.reload()}}
async function create(){try{setStatus("Creating project...");const d=await api("/api/projects",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title:$("title").value,artist:$("artist").value,lyrics:$("lyrics").value,creative_direction:$("dir").value,notes:$("notes").value})});pid=d.project.id;$("world").disabled=false;const f=$("audio").files[0];if(f){const s=await api("/api/projects/"+pid+"/audio/upload-url",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({filename:f.name})});const upload=await fetch(s.upload_url,{method:"PUT",body:f});if(!upload.ok)throw Error("Audio upload failed");await api("/api/projects/"+pid+"/audio/complete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({source_id:s.source_id,name:f.name,type:f.type,size:f.size})});ready=true}$("status").textContent="Project created. Reveal the world."}catch(e){setStatus(e.message,true)}}
function renderReport(report){const root=$("report");root.replaceChildren();const h=document.createElement("h3");h.textContent=report.song_summary||"";root.append(h);const p=document.createElement("p");p.textContent=report.emotional_arc||"";root.append(p);const pre=document.createElement("pre");pre.textContent=JSON.stringify(report.style_bible||{},null,2);root.append(pre)}
async function world(){try{setStatus("Building Visual World Report...");const d=await api("/api/projects/"+pid+"/world",{method:"POST"});renderReport(d.report);$("image").disabled=false;$("render").disabled=!ready;setStatus("World revealed.")}catch(e){setStatus(e.message,true)}}
async function image(){try{setStatus("Generating image...");const d=await api("/api/projects/"+pid+"/image",{method:"POST"});const root=$("media");root.replaceChildren();const img=document.createElement("img");img.src=d.image_url;img.alt="BeatVision generated hero image";img.referrerPolicy="no-referrer";root.append(img);$("render").disabled=!ready;setStatus("Hero image ready.")}catch(e){setStatus(e.message,true)}}
async function render(){try{setStatus("Queueing Shotstack render...");const d=await api("/api/projects/"+pid+"/render",{method:"POST"});for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,5000));const x=await api("/api/renders/"+d.render.id);setStatus("Render: "+x.render.status);if(x.render.status==="done"){const a=document.createElement("a");a.target="_blank";a.rel="noopener noreferrer";a.href=x.render.output_url;a.textContent="Open rendered video";$("media").append(document.createElement("p")).append(a);return}if(x.render.status==="failed")throw Error(x.render.error_message||"Render failed")}}catch(e){setStatus(e.message,true)}}
$("register").addEventListener("click",()=>authenticate("register"));$("login").addEventListener("click",()=>authenticate("login"));$("logout").addEventListener("click",logout);$("create").addEventListener("click",create);$("world").addEventListener("click",world);$("image").addEventListener("click",image);$("render").addEventListener("click",render);
</script></body></html>
