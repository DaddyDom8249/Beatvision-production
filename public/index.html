<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <title>BeatVision</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#08090c;color:#f4f5f7}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#202536 0,#08090c 45%);min-height:100vh}
    .wrap{max-width:1100px;margin:auto;padding:32px 18px 80px}.brand{font-size:28px;font-weight:800;letter-spacing:-.04em}
    .tag{color:#aeb5c5;margin:6px 0 30px}.card{background:#10131a;border:1px solid #252b38;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 40px #0005}
    h1{font-size:40px;letter-spacing:-.05em;margin:0 0 10px}h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    label{display:block;color:#aeb5c5;font-size:13px;margin-bottom:6px}input,textarea,button{font:inherit}
    input,textarea{width:100%;background:#0a0c11;color:#fff;border:1px solid #303747;border-radius:10px;padding:12px}
    textarea{min-height:130px;resize:vertical}.full{grid-column:1/-1}button{border:0;border-radius:10px;padding:12px 18px;background:#f4f5f7;color:#08090c;font-weight:800;cursor:pointer}
    button.secondary{background:#252b38;color:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#8f97a8}.error{color:#ff8c8c}.ok{color:#9cf0b4}
    pre{white-space:pre-wrap;background:#090b10;padding:16px;border-radius:10px;overflow:auto}.hidden{display:none}
    .pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#242b38;color:#cbd2df;font-size:12px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:32px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">BeatVision</div>
  <div class="tag">Every Song Has a World. BeatVision Reveals It.</div>

  <section id="auth" class="card">
    <h1>Start a world.</h1>
    <p class="muted">No external AI account. No exposed provider keys. Just your BeatVision account.</p>
    <div class="grid">
      <div><label>Username</label><input id="username" autocomplete="username"></div>
      <div><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button onclick="auth('login')">Sign in</button>
      <button class="secondary" onclick="auth('register')">Create account</button>
      <span id="authMsg" class="muted"></span>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="row"><span class="pill">World Engine</span><button class="secondary" onclick="logout()">Sign out</button></div>
      <h1>Create the world.</h1>
      <div class="grid">
        <div><label>Song title</label><input id="title"></div>
        <div><label>Artist</label><input id="artist"></div>
        <div class="full"><label>Lyrics</label><textarea id="lyrics"></textarea></div>
        <div class="full"><label>Creative direction</label><textarea id="direction" placeholder="Mood, era, genre, emotional intent, references, things to avoid..."></textarea></div>
        <div class="full"><label>Notes</label><textarea id="notes"></textarea></div>
      </div>
      <div class="row" style="margin-top:14px"><button onclick="createProject()">Reveal World</button><span id="projectMsg" class="muted"></span></div>
    </div>

    <div id="reportCard" class="card hidden">
      <span class="pill">Visual World Report</span>
      <h2 id="reportTitle"></h2>
      <div id="report"></div>
      <div class="row"><button onclick="approveWorld()">Yes, that's my world.</button><span id="approveMsg" class="muted"></span></div>
    </div>

    <div id="sceneCard" class="card hidden">
      <span class="pill">Scenes</span>
      <div id="scenes"></div>
      <div class="row"><button onclick="generateImage()">Generate selected scene image</button><button class="secondary" onclick="renderVideo()">Render video</button></div>
      <pre id="job"></pre>
    </div>
  </section>
</div>
<script>
let projectId=null, selectedScene=0;
const $=id=>document.getElementById(id);
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function show(id,on=true){$(id).classList.toggle('hidden',!on)}
async function auth(mode){$('authMsg').textContent='Working...';try{await api('/api/auth/'+mode,{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});show('auth',false);show('app',true)}catch(e){$('authMsg').textContent=e.message}}
async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}
async function createProject(){ $('projectMsg').textContent='Building your world...';try{const d=await api('/api/projects',{method:'POST',body:JSON.stringify({title:$('title').value,artist:$('artist').value,lyrics:$('lyrics').value,creative_direction:$('direction').value,notes:$('notes').value})});projectId=d.project.id;const r=await api('/api/projects/'+projectId+'/world',{method:'POST'});renderReport(r.report);$('projectMsg').textContent='World revealed.'}catch(e){$('projectMsg').textContent=e.message}}
function renderReport(r){show('reportCard');$('reportTitle').textContent=r.title||'Your world';$('report').innerHTML='<pre>'+escapeHtml(JSON.stringify(r,null,2))+'</pre>'}
async function approveWorld(){try{const d=await api('/api/projects/'+projectId+'/approve',{method:'POST'});renderScenes(d.scenes);$('approveMsg').textContent='World locked.'}catch(e){$('approveMsg').textContent=e.message}}
function renderScenes(s){show('sceneCard');$('scenes').innerHTML=s.map((x,i)=>'<div class="card"><b>Scene '+(i+1)+'</b><p>'+escapeHtml(x.prompt)+'</p><span class="pill">'+x.duration_seconds+'s</span></div>').join('')}
async function generateImage(){try{$('job').textContent='Generating image...';const d=await api('/api/projects/'+projectId+'/scenes/'+selectedScene+'/image',{method:'POST'});$('job').textContent=JSON.stringify(d,null,2)}catch(e){$('job').textContent=e.message}}
async function renderVideo(){try{$('job').textContent='Submitting render...';const d=await api('/api/projects/'+projectId+'/render',{method:'POST'});$('job').textContent=JSON.stringify(d,null,2)}catch(e){$('job').textContent=e.message}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
(async()=>{try{const d=await api('/api/me');if(d.user){show('auth',false);show('app',true)}}catch{}})();
</script>
</body>
</html>
