<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeatVision</title><style>body{margin:0;background:#090b10;color:#fff;font-family:system-ui}main{max-width:850px;margin:auto;padding:40px 20px}section{background:#121722;border:1px solid #2a3342;border-radius:18px;padding:22px;margin:18px 0}input,textarea,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:10px;border:1px solid #394454;background:#0a0d13;color:#fff}button{background:#fff;color:#000;font-weight:800}textarea{min-height:100px}img{max-width:100%;border-radius:12px;margin-top:12px}.hide{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}pre{white-space:pre-wrap}</style></head><body><main><h1>BeatVision</h1><p>Every Song Has a World. BeatVision Reveals It.</p><section id="auth"><div class="row"><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"></div><div class="row"><button onclick="auth('register')">Create account</button><button onclick="auth('login')">Sign in</button></div><p id="authmsg"></p></section><section id="app" class="hide"><button onclick="logout()">Sign out</button><input id="title" placeholder="Song title"><input id="artist" placeholder="Artist"><textarea id="lyrics" placeholder="Lyrics"></textarea><textarea id="dir" placeholder="Creative direction"></textarea><textarea id="notes" placeholder="Notes"></textarea><input id="audio" type="file" accept="audio/*"><button onclick="create()">Create project</button><button id="world" disabled onclick="world()">Reveal World</button><button id="image" disabled onclick="image()">Generate Hero Image</button><button id="render" disabled onclick="render()">Render Video</button><p id="status"></p><div id="report"></div><div id="media"></div></section></main><script>
let pid=null,ready=false;const $=x=>document.getElementById(x);async function api(p,o={}){const r=await fetch(p,{credentials:"same-origin",...o}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}async function auth(m){try{const d=await api("/api/auth/"+m,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({username:$("user").value,password:$("pass").value})});$("auth").classList.add("hide");$("app").classList.remove("hide");$("authmsg").textContent="Signed in as "+d.user.username}catch(e){$("authmsg").textContent=e.message}}async function logout(){await api("/api/auth/logout",{method:"POST"});location.reload()}async function create(){try{const d=await api("/api/projects",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title:$("title").value,artist:$("artist").value,lyrics:$("lyrics").value,creative_direction:$("dir").value,notes:$("notes").value})});pid=d.project.id;$("world").disabled=false;const f=$("audio").files[0];if(f){const s=await api("/api/projects/"+pid+"/audio/upload-url",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({filename:f.name})});if(!(await fetch(s.upload_url,{method:"PUT",body:f})).ok)throw Error("Audio upload failed");await api("/api/projects/"+pid+"/audio/complete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({source_id:s.source_id,name:f.name,type:f.type,size:f.size})});ready=true}$("status").textContent="Project created. Reveal the world."}catch(e){$("status").textContent=e.message}}async function world(){try{$("status").textContent="Building Visual World Report...";const d=await api("/api/projects/"+pid+"/world",{method:"POST"});$("report").innerHTML="<h3>"+d.report.song_summary+"</h3><p>"+d.report.emotional_arc+"</p><pre>"+JSON.stringify(d.report.style_bible,null,2)+"</pre>";$("image").disabled=false;$("render").disabled=!ready;$("status").textContent="World revealed."}catch(e){$("status").textContent=e.message}}async function image(){try{$("status").textContent="Generating image...";const d=await api("/api/projects/"+pid+"/image",{method:"POST"});$("media").innerHTML="<img src='"+d.image_url+"'>";$("render").disabled=!ready;$("status").textContent="Hero image ready."}catch(e){$("status").textContent=e.message}}async function render(){try{$("status").textContent="Queueing Shotstack render...";const d=await api("/api/projects/"+pid+"/render",{method:"POST"});for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,5000));const x=await api("/api/renders/"+d.render.id);$("status").textContent="Render: "+x.render.status;if(x.render.status==="done"){ $("media").innerHTML+="<p><a target='_blank' href='"+x.render.output_url+"'>Open rendered video</a></p>";return}if(x.render.status==="failed")throw Error(x.render.error_message||"Render failed")}}catch(e){$("status").textContent=e.message}}</script></body></html>
